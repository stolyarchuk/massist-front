    <style>
      /* Ensure header title has flexible positioning */
      .header-title {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        padding: 0 1rem;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Add scroll event listener to change header appearance when scrolled
      document.addEventListener("DOMContentLoaded", function () {
        const observer = new IntersectionObserver(
          (entries) => {
            const header = document.querySelector(".header-title");
            if (header) {
              if (entries[0].isIntersecting) {
                header.classList.remove("background");
              } else {
                header.classList.add("background");
              }
            }
          },
          { threshold: 0.1 }
        );

        // Add a small delay to ensure React has rendered the components
        setTimeout(() => {
          const header = document.querySelector(".header-title");
          if (header) {
            observer.observe(header);
          }
        }, 1000);

        // Handle scrollbar opacity changes when scrolling
        let scrollTimer;
        const html = document.documentElement;

        function showFullOpacityScrollbar() {
          html.classList.add("scrolling");
        }

        function resetScrollbarOpacity() {
          scrollTimer = setTimeout(() => {
            html.classList.remove("scrolling");
          }, 1000); // Reset after 1 second of no scrolling
        }

        window.addEventListener("scroll", function () {
          clearTimeout(scrollTimer);
          showFullOpacityScrollbar();
          resetScrollbarOpacity();
        });
      });
    </script>
  </body>
</html>
